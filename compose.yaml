volumes:
  minio-data:
    name: minio-data
  kafka-connect-data:
    name: kafka-connect-data
  jupyter-data:
    name: jupyter-data
  metastore-db:
    name: metastore-db
  spark-events:
    name: spark-events
  spark-worker-1-data:
    name: spark-worker-1-data
  spark-worker-2-data:
    name: spark-worker-2-data