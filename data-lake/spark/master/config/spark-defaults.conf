# === MEMORY CONFIGURATION (for limited resources) ===
spark.driver.memory=4g
spark.executor.memory=4g
spark.executor.memoryOverhead=1g

# Memory fractions (conservative for stability)
spark.memory.fraction=0.4
spark.memory.storageFraction=0.3

# === DISK SPILL (critical for large data on limited resources) ===
spark.shuffle.spill.compress=true

# === PARALLELISM (reduced for memory efficiency) ===
spark.sql.shuffle.partitions=200
spark.default.parallelism=12
spark.executor.cores=2
spark.task.cpus=1

# === ADAPTIVE QUERY EXECUTION ===
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.coalescePartitions.minPartitionSize=32MB
spark.sql.adaptive.skewJoin.enabled=true
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes=128MB

# === COMPRESSION ===
spark.sql.parquet.compression.codec=snappy
spark.io.compression.codec=lz4
spark.shuffle.compress=true
spark.rdd.compress=true
spark.broadcast.compress=true

# === BROADCAST (reduced threshold to avoid OOM) ===
spark.sql.autoBroadcastJoinThreshold=10MB

# === NETWORK & TIMEOUTS ===
spark.network.timeout=600s
spark.executor.heartbeatInterval=60s
spark.sql.broadcastTimeout=600s

# === GARBAGE COLLECTION ===
spark.executor.extraJavaOptions=-XX:+UseG1GC -XX:G1HeapRegionSize=16m -XX:InitiatingHeapOccupancyPercent=35
spark.driver.extraJavaOptions=-XX:+UseG1GC -XX:G1HeapRegionSize=16m

# === S3A/MinIO Configuration ===
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=minioadmin
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.fast.upload=true
spark.hadoop.fs.s3a.fast.upload.buffer=bytebuffer
spark.hadoop.fs.s3a.multipart.size=67108864
spark.hadoop.fs.s3a.connection.maximum=30

# === HIVE METASTORE ===
spark.sql.catalogImplementation=hive
spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
spark.sql.warehouse.dir=s3a://datalake/warehouse

# === DELTA LAKE ===
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog

# === SERIALIZATION ===
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max=256m

# === EVENT LOG (for Spark UI history) ===
spark.eventLog.enabled=true
spark.eventLog.dir=/tmp/spark-events
