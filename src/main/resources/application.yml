spring:
  application:
    name: EtlEngine
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=SUPPORT;encrypt=true;trustServerCertificate=true;
    username: sa
    password: verYs3cret
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 8
      connection-timeout: 300000     # 5 минут
      idle-timeout: 600000           # 10 минут
      max-lifetime: 1800000          # 30 минут
      connection-test-query: SELECT 1
      register-mbeans: true
  jpa:
    hibernate:
      ddl-auto: validate              # Flyway управляет схемой, Hibernate только валидирует
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false                   # Отключить вывод SQL в консоль
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        default_schema: service       # Схема по умолчанию
    open-in-view: false               # Отключить open-session-in-view для production
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: service
    baseline-version: 0
    validate-on-migrate: true
    create-schemas: true
  main:
    banner-mode: off
kafka:
  bootstrap-servers: localhost:29092,localhost:39092,localhost:49092
  schema-registry-url: http://localhost:8081
etl:
  # Количество физических CPU ядер для расчёта размеров пулов, определяет количество параллельных джобов.
  available-processors: 4

  # Коэффициенты для расчёта размеров пулов
  pool:
    # corePoolSize = available-processors * core-multiplier
    core-multiplier: 0.5
    # maxPoolSize = available-processors * max-multiplier
    max-multiplier: 1.0
    # Размер очереди задач
    queue-size: 500
    # Keep-alive время для idle потоков (секунды)
    keep-alive-seconds: 120

  # HikariCP: maxPoolSize + фиксированный запас для JPA/HTTP
  hikari-extra-connections: 8

logging:
  level:
    root: INFO
    # ETL Engine - ключевые операции
    ru.pospelov.etl.engine.engine: INFO
    ru.pospelov.etl.engine.steps: INFO
    ru.pospelov.etl.engine.metrics: INFO
    # Kafka - минимальное логирование
    org.apache.kafka: WARN
    org.apache.kafka.clients.consumer: WARN
    org.apache.kafka.common.utils.AppInfoParser: ERROR
    io.confluent.kafka.serializers: WARN
    io.confluent.kafka.serializers.KafkaAvroDeserializerConfig: WARN
    # Spring/Hibernate - минимальное
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
